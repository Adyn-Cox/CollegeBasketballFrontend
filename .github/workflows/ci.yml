name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Updated from 16 (EOL) to current LTS
          cache: 'yarn'
          cache-dependency-path: 'app/yarn.lock'  # Adjust if yarn.lock is not in /app

      - name: Install dependencies
        working-directory: app
        run: yarn install --frozen-lockfile  # Safer for CI

      - name: Type check
        working-directory: app
        run: yarn tsc --noEmit

      - name: Run lint
        working-directory: app
        run: yarn lint

      - name: Build
        working-directory: app
        run: yarn build

      - name: Check for vulnerabilities
        working-directory: app
        run: yarn audit --groups dependencies  # Only production deps